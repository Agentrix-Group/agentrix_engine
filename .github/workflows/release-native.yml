name: release-starfighter-engine

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: starfighter-engine-linux
            binary: target/release/starfighter-engine
          - os: macos-latest
            artifact: starfighter-engine-macos
            binary: target/release/starfighter-engine
          - os: windows-latest
            artifact: starfighter-engine-windows.exe
            binary: target/release/starfighter-engine.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Starfighter engine
        run: cargo build --release --bin starfighter-engine
      - name: Stage artifact
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.artifact }}"
      - name: Publish release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
