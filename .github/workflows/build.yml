name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Pull build cache
        id: cache-build
        uses: actions/cache@v3
        with:
          path: ./target
          key: windows-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('./src') }}-${{ hashFiles('./launchers') }}
      - name: Build
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: cargo build

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Pull build cache
        id: cache-build
        uses: actions/cache@v3
        with:
          path: ./target
          key: mac-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('./src') }}-${{ hashFiles('./launchers') }}
      - name: Build
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: cargo build

  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Pull build cache
        id: cache-build
        uses: actions/cache@v3
        with:
          path: ./target
          key: ubuntu-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('./src') }}-${{ hashFiles('./launchers') }}
      - name: Get dependencies
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: sudo apt install libasound2-dev libudev-dev pkg-config
      - name: Build
        if: steps.cache-build.outputs.cache-hit != 'true'
        run: cargo build

  # build-wasm removed: launchers/wasm was excluded from the Cargo
  # workspace during the Avian2D migration (Fase 0) -- it depended on
  # Settings.opponent_policy, a .roguenet RL policy-loading field that no
  # longer exists, and was still pinned to bevy 0.9. It is not part of
  # Agentrix's integration surface (games/starfighter/, native-launcher,
  # starfighter-engine); building it here would fail regardless of the
  # toolchain fix above. release-gh-pages.yml still builds it on a
  # version tag and has the same problem -- separate, not touched here.
