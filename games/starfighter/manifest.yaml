id: starfighter
name: Starfighter Arena
version: 0.1.0
description: >
  2D Newtonian space dogfight. Ships move by inertia (thrust, drag, active
  braking), manage a shared health/energy pool, can raise an energy shield
  that reduces incoming bullet damage, and fire cooldown-limited bullets.
  Continuous coordinate arena (not a grid) -- grid_width/grid_height do not
  apply to this game, arena dimensions are declared under settings instead.
  Free-for-all: 2 to 4 symmetric ships, no teams in this version.
min_players: 2
max_players: 4
max_ticks: 3600
settings:
  # Simulation
  tick_hz: "60"
  arena_width: "2000"
  arena_height: "1000"
  # Ship model (Fase 1, src/lib.rs constants -- values are placeholders,
  # real balance is out of scope until a real contest needs it)
  ship_max_health: "100"
  ship_max_energy: "100"
  bullet_damage: "25"
  asteroid_damage: "100"
  shoot_energy_cost: "15"
  shield_energy_cost_per_tick: "1"
  shield_damage_reduction: "0.7"
  energy_regen_per_tick: "0.5"
  # Perception (Decision 2.3 -- declared now, not consumed by the engine
  # yet: Fase 3 wires this up as a per-slot radar cutoff read from the
  # frozen match snapshot, not a hardcoded constant in the engine).
  radar_range: "800"
