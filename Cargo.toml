[workspace]
members = [
    ".",
    "crates/engine-host",
    "crates/sim-core",
    "crates/games/conformance-game",
    "bins/conformance-runner",
]
resolver = "2"

[package]
name = "bevy-starfighter"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["rlib"]
name = "bevy_starfighter"

[[bin]]
name = "starfighter-engine"
path = "launchers/native/src/engine_main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bevy = { version = "0.19", default-features = false }
rapier2d = { version = "0.35.3", default-features = false, features = ["dim2", "f32", "std", "enhanced-determinism"] }
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
agentrix-sim-core = { path = "crates/sim-core" }
agentrix-engine-host = { path = "crates/engine-host" }

[dev-dependencies]
proptest = "1.11"
criterion = "0.8"
agentrix-conformance-game = { path = "crates/games/conformance-game" }

[[bench]]
name = "tick_throughput"
harness = false
