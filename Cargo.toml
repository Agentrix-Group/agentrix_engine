[workspace]
members = [
    ".",
    "crates/engine-host",
    "crates/sim-core",
    "crates/games/conformance-game",
    "bins/conformance-runner",
]
resolver = "2"

[package]
name = "bevy-starfighter"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["rlib"]
name = "bevy_starfighter"

[[bin]]
name = "starfighter-engine"
path = "launchers/native/src/engine_main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bevy = { version = "0.19", default-features = false }
avian2d = { version = "0.7.0", default-features = false, features = ["2d", "f32", "parry-f32", "default-collider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
agentrix-sim-core = { path = "crates/sim-core" }
agentrix-engine-host = { path = "crates/engine-host" }

[dev-dependencies]
proptest = "1"
criterion = "0.5"
agentrix-conformance-game = { path = "crates/games/conformance-game" }

[[bench]]
name = "tick_throughput"
harness = false
