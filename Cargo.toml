[package]
name = "bevy-starfighter"
version = "0.3.0"
edition = "2021"

[lib]
crate-type = ["rlib"]
name = "bevy_starfighter"

[[bin]]
name = "starfighter-engine"
path = "launchers/native/src/engine_main.rs"

[dependencies]
rand = { version = "0.8.5", features = ["small_rng"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bevy = { version = "0.19", default-features = false }
avian2d = { version = "0.7.0", default-features = false, features = ["2d", "f32", "parry-f32", "default-collider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[[bench]]
name = "tick_throughput"
harness = false
