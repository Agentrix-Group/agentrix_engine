[toolchain]
# Phase 0 product baseline. Release and conformance evidence is tied to this
# exact compiler; upgrades are explicit compatibility cuts, never silent moves
# of the `stable` alias.
channel = "1.98.1"
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-gnu"
]
profile = "minimal"
